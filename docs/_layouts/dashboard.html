<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soulseek Search Monitor - {{ page.title | default: "Dashboard" }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: white;
            color: #222;
            line-height: 1.5;
        }

        {% include nav-styles.html %}

        @media (max-width: 768px) {
            .stats-tables {
                flex-direction: column;
                gap: 20px;
            }
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            padding: 40px 30px 60px;
        }

        h1 {
            color: #111;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin: 0 0 16px;
        }

        h2 {
            color: #111;
            font-size: 18px;
            margin-top: 64px;
            font-weight: 600;
        }

        .stats-tables {
            display: flex;
            gap: 60px;
            margin: 24px 0;
            justify-content: flex-start;
        }

        .stats-table {
            border-collapse: collapse;
            min-width: 280px;
        }

        .stats-table caption {
            text-align: left;
            font-size: 12px;
            font-weight: 500;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding-bottom: 12px;
        }

        .stats-table td {
            border-bottom: 1px solid #f2f2f2;
        }

        .stats-table tr:last-child td {
            border-bottom: none;
        }

        .stats-label {
            color: #666;
            font-size: 15px;
            padding: 10px 30px 10px 0;
        }

        .stats-value {
            font-size: 15px;
            font-weight: 500;
            color: #111;
            text-align: right;
            font-variant-numeric: tabular-nums;
            padding: 10px 0;
        }

        .chart {
            margin: 16px 0 24px;
        }

        .timestamp {
            color: #999;
            font-size: 13px;
            margin-top: 4px;
        }

        .period-range {
            color: #666;
            font-size: 15px;
            margin: 0;
            font-weight: 400;
        }

        .footer {
            margin-top: 80px;
            font-size: 13px;
        }

        .footer a {
            color: #999;
        }

        .period-title {
            color: #666;
            font-size: 18px;
            margin-bottom: 10px;
        }

    </style>
    <script src="https://cdn.plot.ly/plotly-3.3.0.min.js" charset="utf-8"></script>
</head>
<body>
    {% include nav.html %}

    <div class="container">
        {{ content }}

        <div class="footer">
            <p><a href="https://github.com/ghxm/soulseek-research">View on GitHub</a></p>
        </div>
    </div>
{% if site.goatcounter_url and site.goatcounter_url != "" %}
<script data-goatcounter="{{ site.goatcounter_url }}" async src="//gc.zgo.at/count.js"></script>
{% endif %}
</body>
</html>
