name: Update Statistics Dashboard

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC (after cron jobs finish)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dashboard.txt

      - name: Open SSH tunnel to database
        env:
          DB_SERVER_SSH_KEY: ${{ secrets.DB_SERVER_SSH_KEY }}
          DB_SERVER_IP: ${{ secrets.DB_SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$DB_SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Silence stderr so the "# <ip>:22 SSH-<banner>" comment lines
          # from ssh-keyscan never reach the workflow log. Even with GH's
          # automatic secret masking, keeping the IP out of the log stream
          # entirely is safer.
          ssh-keyscan -H "$DB_SERVER_IP" 2>/dev/null >> ~/.ssh/known_hosts
          ssh -f -N \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes \
            -o TCPKeepAlive=yes \
            -L 5432:localhost:5432 root@"$DB_SERVER_IP"

      - name: Generate statistics
        env:
          DATABASE_URL: postgresql://soulseek:${{ secrets.DB_PASSWORD }}@localhost:5432/soulseek
          QUERY_BLACKLIST: ${{ vars.QUERY_BLACKLIST }}
        run: python -u scripts/generate_stats.py

      - name: Upload query DB chunks to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail
          # Only run if the R2 target is configured; otherwise keep chunks
          # in the Pages artifact (legacy behavior). This lets us disable
          # R2 for a run by clearing the R2_BUCKET repo variable.
          if [ -z "$R2_BUCKET" ] || [ -z "$R2_PUBLIC_URL" ]; then
            echo "R2 not configured, keeping chunks in Pages artifact"
            exit 0
          fi

          # aws-cli talks to R2 via the S3-compatible endpoint. Streaming
          # payload signing is off because R2 does not implement it.
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # Upload all query DB chunks in one sync. Content-addressed
          # filenames mean old chunks stay valid; new chunks land alongside.
          # Cache-Control: 1 year (chunks are immutable per content hash).
          aws s3 sync docs/data/ "s3://${R2_BUCKET}/data/" \
            --endpoint-url "$ENDPOINT" \
            --exclude "*" \
            --include "queries_*.db.*" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress

          # Rewrite each config JSON so urlPrefix points at R2. We keep
          # the config in the Pages artifact (small, stable path, cache-
          # busted by query.html) so the browser can bootstrap without
          # any cross-origin request until the chunks themselves.
          python scripts/rewrite_config_urlprefix.py docs/data/queries_*_config.json

          # Remove chunk files from the Pages artifact so they don't
          # count against the 1 GB cap.
          find docs/data -type f -name 'queries_*.db.*' -delete

          # Housekeeping: delete R2 chunks that no build in the last
          # 30 days has referenced. Not implemented yet -- content-
          # addressed names mean stale versions accumulate silently.
          # TODO: add lifecycle rule on the bucket (Cloudflare UI) to
          # expire objects untouched for 30 days.

      - name: Configure analytics
        if: vars.GOATCOUNTER_URL != ''
        env:
          GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}
        run: |
          echo "goatcounter_url: \"${GOATCOUNTER_URL}\"" >> docs/_config.yml

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
